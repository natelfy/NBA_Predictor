name: NBA Oracle - Mise à jour quotidienne

on:
  schedule:
    # 10h UTC = 11h Paris (avant les matchs)
    - cron: '0 10 * * *'
    # 8h UTC = 9h Paris (mise à jour résultats de la veille)
    - cron: '0 8 * * *'
  
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Le matin: collecter données + prédictions
      - name: 🏀 Collecter données NBA
        run: python src/get_data.py
        continue-on-error: true
      
      - name: ⚙️ Traiter les données
        run: python src/process_data.py
      
      - name: 🧠 Entraîner le modèle
        run: python src/train_model.py
      
      # Mettre à jour les résultats des matchs d'hier
      - name: 📊 Mettre à jour le tracking
        run: python src/tracker.py --update
        continue-on-error: true
      
      # Sauvegarder
      - name: 💾 Commit et push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ models/
          git diff --staged --quiet || git commit -m "🔄 MAJ $(date +'%Y-%m-%d %H:%M')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: ✅ Résumé
        run: |
          echo "✅ Mise à jour terminée!"
          echo ""
          echo "📊 Métriques:"
          cat models/metrics.txt || echo "N/A"
          echo ""
          echo "📈 Tracking:"
          python src/tracker.py --stats || echo "Pas encore de données"
